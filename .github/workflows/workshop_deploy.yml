name: release

on:
 push:
   branches:
     - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:

      - name: Check out latest commit
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'

      - name: Create release zip
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: 'gravship_floodlights_release.zip'
          exclusions: '/.git/* /Sources/* /AddOn/* /.github/* .git* *.pdb'
  
      - name: Extract zip for workshop upload
        env:
          ZIP_FILE: 'gravship_floodlights_release.zip'
        run: |
          sudo apt-get install unzip
          mkdir ws-upload/
          unzip $ZIP_FILE -d ws-upload
    
      - name: Upload to workshop
        uses: m00nl1ght-dev/steam-workshop-deploy@v4
        with:
          username: ${{ secrets.STEAM_USERNAME }}          
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          path: ws-upload
          appId: 294100
          publishedFileId: 3810534416
